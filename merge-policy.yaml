# A language- and platform-independent starting point. Tailor paths and checks
# to each repository. Category controls review expectations; strategy controls
# file merging. Later matching rules win independently for each field.
version: 2
default_strategy: standard
default_category: other

categories:
  source:
    description: "Source code: thorough behavioral and regression review"
    checks:
      - "Trace changes to the requested behavior and existing contracts; inspect callers and consumers."
      - "Review correctness, edge cases, error handling, security, and compatibility; assess performance where relevant."
      - "Run relevant existing tests, builds, and static checks; add regression coverage for changed behavior or fixed defects."
      - "Inspect interactions across all merged branches, including tests, schemas, dependencies, and runtime configuration."
  devops:
    description: "DevOps: validate improvements against the original operational intent"
    checks:
      - "Read the existing configuration and documentation; identify the behavior and constraints it was meant to preserve."
      - "Validate the proposed change with the repository's linters, configuration checks, or non-mutating plan/dry-run tooling."
      - "Compare triggers, environments, permissions, secrets handling, artifacts, deployment order, and rollback behavior with the existing intent."
  docs:
    description: "Documentation and process guidance"
    checks:
      - "Check accuracy, links, and examples against the resulting implementation and workflow."
  data:
    description: "Data and assets"
    checks:
      - "Validate formats, schemas, consumers, and any required reproducibility or provenance."
  other:
    description: "Unclassified: establish purpose before accepting changes"
    checks:
      - "Identify the file's purpose and update classification if appropriate; use source-level scrutiny for executable or behavioral changes."

rules:
  # Broad examples, not an exhaustive language allowlist. Unknown files retain
  # normal Git handling and explicit review rather than being ignored.
  - patterns: ["src/**", "lib/**", "app/**", "apps/**", "packages/**", "tests/**", "test/**"]
    category: source
  - patterns: ["*.py", "*.js", "*.jsx", "*.ts", "*.tsx", "*.mjs", "*.cjs", "*.java", "*.kt", "*.scala", "*.go", "*.rs", "*.c", "*.h", "*.cpp", "*.hpp", "*.cs", "*.fs", "*.rb", "*.php", "*.swift", "*.m", "*.mm", "*.dart", "*.ex", "*.exs", "*.erl", "*.hs", "*.lua", "*.r", "*.R", "*.jl", "*.sh", "*.ps1", "*.sql", "*.vue", "*.svelte", "*.html", "*.css", "*.scss", "*.proto", "*.graphql", "*.ipynb"]
    category: source
  - patterns: ["package.json", "pyproject.toml", "Cargo.toml", "go.mod", "go.sum", "Gemfile", "Gemfile.lock", "composer.json", "composer.lock", "pom.xml", "build.gradle*", "*.csproj", "*.fsproj", "requirements*.txt"]
    category: source
  - patterns: ["package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml", "bun.lock", "bun.lockb", "poetry.lock", "uv.lock", "Pipfile.lock", "Cargo.lock", "packages.lock.json"]
    category: source
  - patterns: ["*.md", "*.rst", "*.adoc", "docs/**", "LICENSE*", "NOTICE*"]
    category: docs
  - patterns: ["data/**", "assets/**", "*.csv", "*.tsv", "*.parquet"]
    category: data

  # Paths establish purpose: YAML/JSON can be application data or executable
  # operational configuration. No global structured merge for either format.
  - patterns: ["**/.github/workflows/**", "**/.github/actions/**", "**/.circleci/**", "**/.gitlab/**", ".gitlab-ci.yml", "azure-pipelines*.yml", "Jenkinsfile*", "**/ci/**", "**/infra/**", "**/infrastructure/**", "**/deploy/**", "**/deployment/**", "**/terraform/**", "**/ansible/**", "**/k8s/**", "**/kubernetes/**", "**/helm/**", "**/charts/**", "Dockerfile*", "Containerfile*", "docker-compose*.yml", "docker-compose*.yaml", "compose*.yml", "compose*.yaml", "*.tf", "*.tfvars", "*.tf.json", "*.tfvars.json", "Pulumi*.yaml", ".terraform.lock.hcl", "Makefile", "*.mk", ".gitattributes", ".gitignore", "merge-policy.yaml"]
    category: devops
    strategy: standard

  # Commands vary with package-manager versions. Add a command to a specific
  # rule only when it is documented for the owning package. Never auto-executed.
  - patterns: ["package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml", "bun.lock", "bun.lockb", "poetry.lock", "uv.lock", "Pipfile.lock", "Cargo.lock", "packages.lock.json"]
    strategy: regenerate
    reason: "Reconcile inputs and regenerate with the repository's pinned tools."
  - patterns: ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.webp", "*.ico", "*.pdf", "*.zip", "*.gz", "*.woff", "*.woff2", "*.sqlite", "*.db", "*.parquet"]
    strategy: manual-conflict

  # Opt in only for data whose consumers tolerate reserialization:
  # - pattern: "data/catalog/*.json"
  #   category: data
  #   strategy: json-deep-merge

commit_message:
  title_template: "Merge branches: {branches}"
  group_by: category
  include_stat_counts: true
  include_strategy_used: true
